services:
  kee-plus:
    build: .
    image: kee-plus:dev
    container_name: kee-plus
    restart: unless-stopped
    ports:
      # Loopback only by default: reach it through a proxy on the same
      # host, such as `tailscale serve` (docs/deploy-synology.md). There is
      # no login. KEE_BIND=0.0.0.0 in .env publishes it on every interface
      # (anyone on the LAN can then read and edit every note); never expose
      # this port to the internet.
      - "${KEE_BIND:-127.0.0.1}:8090:8080"
    environment:
      # Host names besides IPs and localhost, e.g. the Tailscale serve name
      # "nas.tail1234.ts.net". Set it in .env (git-ignored).
      MYNOTES_HOSTS: ${MYNOTES_HOSTS:-}
    volumes:
      # SQLite database (notes.db) and attachments (files/). Lives next to
      # the clone on the NAS, ignored by git. Back up the whole folder.
      - ./data:/data
